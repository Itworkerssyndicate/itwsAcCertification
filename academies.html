    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', 'Tahoma', sans-serif;
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
            background: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        :root {
            --primary-color: #C9A84C;
            --primary-dark: #A8893A;
            --primary-light: #E8D5A3;
            --primary-glow: rgba(201,168,76,0.3);
            --secondary-color: #0A1628;
            --accent-color: #7C3AED;
            --accent-light: #A78BFA;
            --accent-glow: rgba(124,58,237,0.2);
            --bg-color: #0A0E1A;
            --bg-card: rgba(255,255,255,0.04);
            --bg-hover: rgba(255,255,255,0.06);
            --text-color: #FFFFFF;
            --text-secondary: rgba(255,255,255,0.7);
            --text-muted: rgba(255,255,255,0.4);
            --text-dim: rgba(255,255,255,0.15);
            --success: #10B981;
            --success-bg: rgba(16,185,129,0.12);
            --error: #EF4444;
            --error-bg: rgba(239,68,68,0.12);
            --warning: #F59E0B;
            --warning-bg: rgba(245,158,11,0.12);
            --info: #3B82F6;
            --info-bg: rgba(59,130,246,0.12);
            --border: rgba(255,255,255,0.06);
            --border-light: rgba(255,255,255,0.03);
            --card-bg: rgba(255,255,255,0.04);
            --shadow: 0 20px 60px rgba(0,0,0,0.3);
            --radius: 20px;
            --radius-sm: 12px;
            --radius-lg: 28px;
        }

        .page-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 30%, var(--primary-glow) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, var(--accent-glow) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.04) 0%, transparent 60%);
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.04) rotate(1.5deg); opacity: 0.9; }
        }

        .page-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 600 600' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .particles-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particleFloat 22s infinite ease-in-out;
        }

        .particle:nth-child(1) { width: 6px; height: 6px; top: 5%; left: 5%; animation-delay: 0s; background: var(--primary-color); opacity: 0.3; }
        .particle:nth-child(2) { width: 8px; height: 8px; top: 15%; left: 30%; animation-delay: 2s; background: var(--accent-color); opacity: 0.3; }
        .particle:nth-child(3) { width: 4px; height: 4px; top: 25%; left: 70%; animation-delay: 4s; background: var(--primary-color); opacity: 0.4; }
        .particle:nth-child(4) { width: 7px; height: 7px; top: 40%; left: 10%; animation-delay: 1s; background: var(--accent-color); opacity: 0.25; }
        .particle:nth-child(5) { width: 5px; height: 5px; top: 50%; left: 85%; animation-delay: 3s; background: var(--primary-color); opacity: 0.3; }
        .particle:nth-child(6) { width: 9px; height: 9px; top: 65%; left: 20%; animation-delay: 5s; background: var(--accent-color); opacity: 0.25; }
        .particle:nth-child(7) { width: 4px; height: 4px; top: 75%; left: 60%; animation-delay: 2.5s; background: var(--primary-color); opacity: 0.4; }
        .particle:nth-child(8) { width: 6px; height: 6px; top: 88%; left: 40%; animation-delay: 4.5s; background: var(--accent-color); opacity: 0.3; }

        @keyframes particleFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
            20% { transform: translate(40px, -30px) scale(1.3); opacity: 0.6; }
            40% { transform: translate(-20px, -60px) scale(0.7); opacity: 0.3; }
            60% { transform: translate(50px, -20px) scale(1.4); opacity: 0.7; }
            80% { transform: translate(-30px, -80px) scale(0.8); opacity: 0.4; }
            100% { transform: translate(10px, 0) scale(1); opacity: 0.1; }
        }

        .grid-lines {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(201,168,76,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,168,76,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(30px) translateX(30px); }
        }

        .orbital-ring {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(201,168,76,0.04);
            animation: ringSpin 40s linear infinite;
        }

        .ring:nth-child(1) { width: 350px; height: 350px; border-color: rgba(201,168,76,0.06); }
        .ring:nth-child(2) { width: 550px; height: 550px; border-color: rgba(124,58,237,0.04); animation-duration: 50s; animation-direction: reverse; }
        .ring:nth-child(3) { width: 750px; height: 750px; border-color: rgba(59,130,246,0.03); animation-duration: 60s; }

        @keyframes ringSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }

        .glow-orb:nth-child(1) {
            width: 450px;
            height: 450px;
            top: -150px;
            right: -150px;
            background: var(--primary-glow);
        }

        .glow-orb:nth-child(2) {
            width: 550px;
            height: 550px;
            bottom: -200px;
            left: -200px;
            background: var(--accent-glow);
            animation-delay: 6s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(60px, 40px) scale(1.15); opacity: 0.8; }
        }

        .academies-container {
            position: relative;
            z-index: 10;
            max-width: 1300px;
            margin: 0 auto;
            padding: 16px;
        }

        .header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            animation: headerFloat 6s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, var(--primary-glow), transparent 50%);
            pointer-events: none;
        }

        @keyframes headerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .logo-box {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.4s ease;
            animation: logoSpin 20s linear infinite;
            box-shadow: 0 0 35px var(--primary-glow);
            position: relative;
            background-size: cover;
            background-position: center;
        }

        @keyframes logoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-box:hover {
            animation-duration: 3s;
            transform: scale(1.08);
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-color);
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-president {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 14px;
            background: var(--bg-hover);
            border-radius: 30px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .header-president:hover {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .header-president .president-icon { font-size: 16px; }
        .header-president .president-label { font-size: 11px; color: var(--text-muted); font-weight: 300; }
        .header-president .president-name {
            font-size: 13px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before { width: 300px; height: 300px; }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: #fff;
            box-shadow: 0 4px 25px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 40px var(--primary-glow); }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover { background: var(--bg-hover); border-color: var(--primary-color); transform: translateY(-3px); }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: #fff;
            box-shadow: 0 4px 25px rgba(16,185,129,0.25);
        }
        .btn-success:hover { transform: translateY(-3px) scale(1.02); }

        .btn-danger {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: #fff;
            box-shadow: 0 4px 25px rgba(239,68,68,0.25);
        }
        .btn-danger:hover { transform: translateY(-3px) scale(1.02); }

        .btn-sm { padding: 5px 14px; font-size: 12px; }

        .role-badge {
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 20px;
            background: var(--primary-glow);
            color: var(--primary-color);
            font-weight: 600;
        }

        .page-title-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .page-title-section h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-color) 0%, var(--primary-color) 40%, var(--accent-light) 70%, var(--text-color) 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleFlow 5s ease-in-out infinite;
        }

        @keyframes titleFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .page-title-section p {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 300;
        }

        .search-section {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .search-section:hover {
            border-color: var(--primary-color);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .search-grid .full-width {
            grid-column: 1 / -1;
        }

        .search-grid input,
        .search-grid select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--bg-hover);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-grid input::placeholder {
            color: var(--text-muted);
        }

        .search-grid input:focus,
        .search-grid select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow);
            background: rgba(255,255,255,0.06);
        }

        .search-grid select option {
            background: var(--bg-color);
            color: var(--text-color);
        }

        .search-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .academies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .academy-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .academy-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, var(--primary-glow), transparent 50%);
            pointer-events: none;
        }

        .academy-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }

        .academy-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .academy-card .card-header .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
        }

        .academy-card .card-header .license {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            background: var(--bg-hover);
            padding: 2px 12px;
            border-radius: 8px;
        }

        .academy-card .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .academy-card .card-body .info-item {
            padding: 6px 10px;
            background: var(--bg-hover);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
        }

        .academy-card .card-body .info-item .label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .academy-card .card-body .info-item .value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
        }

        .academy-card .card-body .info-item .value.small {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .academy-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .academy-card .card-footer .cert-count {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--success-bg);
            color: var(--success);
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid rgba(16,185,129,0.2);
        }

        .academy-card .card-footer .actions {
            display: flex;
            gap: 6px;
        }

        .academy-card .card-footer .actions .btn {
            padding: 4px 12px;
            font-size: 11px;
            border-radius: 20px;
        }

        .badge-status {
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-status.active {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(16,185,129,0.2);
        }

        .badge-status.inactive {
            background: var(--error-bg);
            color: var(--error);
            border: 1px solid rgba(239,68,68,0.2);
        }

        .branch-tag {
            font-size: 10px;
            background: var(--bg-hover);
            color: var(--text-muted);
            padding: 1px 10px;
            border-radius: 12px;
            display: inline-block;
            margin: 2px 4px 2px 0;
            border: 1px solid var(--border-light);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .pagination button {
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--bg-hover);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--primary-glow);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination span {
            color: var(--text-muted);
            font-size: 14px;
        }

        .msg {
            display: none;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
        }

        .msg.show { display: block; animation: fadeIn 0.3s ease; }
        .msg.error { background: var(--error-bg); border: 1px solid var(--error); color: var(--error); }
        .msg.success { background: var(--success-bg); border: 1px solid var(--success); color: var(--success); }
        .msg.info { background: var(--info-bg); border: 1px solid var(--info); color: var(--info); }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .loader { display: none; text-align: center; padding: 30px 0; }
        .loader.show { display: block; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;

    <script>
        // ============================================================

        // ============================================================
        // 1. تهيئة Firebase

        const firebaseConfig = {

        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================

        // ============================================================
        let currentUser = null;

        let allAcademies = [];

        let currentPage = 1;
        const itemsPerPage = 9;

        let settings = {
            headerTitle: 'الأكاديميات المعتمدة',
            committeeName: 'لجنة التحول الرقمي والتدريب',
            logoUrl: '',
            footerText: '© 2026 نقابة تكنولوجيا المعلومات والبرمجيات - جميع الحقوق محفوظة',
            presidentName: 'المهندس / محمود جميل',
            presidentLabel: 'النقيب العام:',
            dashboardBtn: 'لوحة التحكم',
            logoutBtn: 'تسجيل الخروج',
            settingsBtn: 'الإعدادات',
            pageTitleMain: 'الأكاديميات المعتمدة',
            pageSubtitle: 'إدارة وعرض جميع الأكاديميات المعتمدة في النظام',
            loaderText: 'جاري تحميل الأكاديميات...',
            presidentFooter: 'النقيب العام:',
            colors: {
                primary: '#C9A84C',
                accent: '#7C3AED',
                background: '#0A0E1A',
                text: '#FFFFFF',
                textSecondary: 'rgba(255,255,255,0.7)',
                textMuted: 'rgba(255,255,255,0.4)',
                textDim: 'rgba(255,255,255,0.15)',
                success: '#10B981',
                error: '#EF4444',
                warning: '#F59E0B',
                info: '#3B82F6',
                border: 'rgba(255,255,255,0.06)',
                cardBg: 'rgba(255,255,255,0.04)'
            }
        };

        let isReady = false;
        let loadedCount = 0;
        const totalDocs = 3;

        // ============================================================
        // 3. إعدادات الـ Listeners
        // ============================================================
        let generalUnsubscribe = null;
        let designUnsubscribe = null;
        let academiesUnsubscribe = null;

        function checkReady() {
            loadedCount++;
            if (loadedCount >= totalDocs && !isReady) {
                isReady = true;
                document.getElementById('pageContent').style.display = 'block';
                document.getElementById('pageLoader').classList.remove('show');
                console.log('✅ academies.html جاهزة');
            }
        }

        function startListeners() {
            document.getElementById('pageContent').style.display = 'none';
            document.getElementById('pageLoader').classList.add('show');

            if (generalUnsubscribe) generalUnsubscribe();
            generalUnsubscribe = db.collection('settings').doc('general').onSnapshot(function(doc) {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.headerTitle) settings.headerTitle = data.headerTitle;
                    if (data.committeeName) settings.committeeName = data.committeeName;
                    if (data.logoUrl) settings.logoUrl = data.logoUrl;
                    if (data.footerText) settings.footerText = data.footerText;
                    if (data.presidentName) settings.presidentName = data.presidentName;
                    if (data.presidentLabel) settings.presidentLabel = data.presidentLabel;
                    if (data.colors) settings.colors = { ...settings.colors, ...data.colors };
                }
                applySettings();
                applyColors(settings.colors);
                if (!isReady) checkReady();
                console.log('تحديث فوري: الإعدادات العامة');
            }, function(error) {
                console.warn('خطأ في الاستماع للإعدادات العامة:', error);
                if (!isReady) checkReady();
            });

            if (designUnsubscribe) designUnsubscribe();
            designUnsubscribe = db.collection('settings').doc('design').onSnapshot(function(doc) {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.colors) {
                        settings.colors = { ...settings.colors, ...data.colors };
                    }
                }
                applyColors(settings.colors);
                if (!isReady) checkReady();
                console.log('تحديث فوري: التصميم');
            }, function(error) {
                console.warn('خطأ في الاستماع للتصميم:', error);
                if (!isReady) checkReady();
            });

            if (academiesUnsubscribe) academiesUnsubscribe();
            academiesUnsubscribe = db.collection('academies').where('isDeleted', '==', false).onSnapshot(function(snapshot) {
                allAcademies = [];
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    data.id = doc.id;
                    allAcademies.push(data);
                });
                populateGovernorates();
                applyFilters();
                if (!isReady) checkReady();
                console.log('تحديث فوري: الأكاديميات (' + allAcademies.length + ')');
            }, function(error) {
                console.warn('خطأ في الاستماع للأكاديميات:', error);
                if (!isReady) checkReady();
            });
        }

        // ============================================================
        // 4. تطبيق الإعدادات
        // ============================================================
        function applySettings() {
            const titleEl = document.getElementById('headerTitle');
            const committeeEl = document.getElementById('committeeName');
            const presidentLabelEl = document.getElementById('presidentLabel');
            const presidentNameEl = document.getElementById('headerPresidentName');
            const footerTextEl = document.getElementById('footerText');
            const presidentFooterEl = document.getElementById('presidentFooter');
            const presidentNameFooterEl = document.getElementById('presidentName');
            const dashboardBtn = document.getElementById('dashboardBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const roleBadge = document.getElementById('roleBadge');
            const pageTitleMain = document.getElementById('pageTitleMain');
            const pageSubtitle = document.getElementById('pageSubtitle');
            const loaderText = document.getElementById('loaderText');

            if (titleEl) titleEl.textContent = settings.headerTitle;
            if (committeeEl) committeeEl.textContent = settings.committeeName;
            if (presidentLabelEl) presidentLabelEl.textContent = settings.presidentLabel;
            if (presidentNameEl) presidentNameEl.textContent = settings.presidentName;
            if (footerTextEl) footerTextEl.textContent = settings.footerText;
            if (presidentFooterEl) presidentFooterEl.textContent = settings.presidentFooter;
            if (presidentNameFooterEl) presidentNameFooterEl.textContent = settings.presidentName;

            if (dashboardBtn) dashboardBtn.textContent = settings.dashboardBtn;
            if (logoutBtn) logoutBtn.textContent = settings.logoutBtn;
            if (settingsBtn) settingsBtn.textContent = settings.settingsBtn;
            if (pageTitleMain) pageTitleMain.textContent = settings.pageTitleMain;
            if (pageSubtitle) pageSubtitle.textContent = settings.pageSubtitle;
            if (loaderText) loaderText.textContent = settings.loaderText;

            if (roleBadge) {
                if (userRole === 'super_admin') {
                    roleBadge.textContent = 'سوبر أدمن';
                    roleBadge.style.background = 'rgba(139,92,246,0.15)';
                    roleBadge.style.color = '#8b5cf6';
                } else if (userRole === 'admin') {
                    roleBadge.textContent = 'أدمن';
                } else {
                    roleBadge.textContent = 'إدارة اللجنة';
                }
            }

            if (settings.logoUrl) {
                const logo = document.getElementById('logoBox');
                if (logo) {
                    logo.style.backgroundImage = 'url(' + settings.logoUrl + ')';
                    logo.style.backgroundSize = 'cover';
                    logo.style.backgroundPosition = 'center';
                    logo.textContent = '';
                }
            }

            const pageTitle = document.getElementById('pageTitle');
            if (pageTitle) {
                pageTitle.textContent = 'نقابة تكنولوجيا المعلومات والبرمجيات - الأكاديميات';
            }

            const ogTitle = document.getElementById('ogTitle');
            const ogDescription = document.getElementById('ogDescription');
            const ogImage = document.getElementById('ogImage');
            const ogUrl = document.getElementById('ogUrl');
            const ogSiteName = document.getElementById('ogSiteName');
            const twitterTitle = document.getElementById('twitterTitle');
            const twitterDescription = document.getElementById('twitterDescription');
            const twitterImage = document.getElementById('twitterImage');
            const favicon = document.getElementById('favicon');
            const appleIcon = document.getElementById('appleIcon');

            if (ogTitle) ogTitle.content = 'نقابة تكنولوجيا المعلومات والبرمجيات - الأكاديميات';
            if (ogDescription) ogDescription.content = 'إدارة الأكاديميات المعتمدة - نظام توثيق الشهادات';
            if (ogUrl) ogUrl.content = window.location.href;
            if (ogSiteName) ogSiteName.content = 'نقابة تكنولوجيا المعلومات والبرمجيات';
            if (twitterTitle) twitterTitle.content = 'نقابة تكنولوجيا المعلومات والبرمجيات - الأكاديميات';
            if (twitterDescription) twitterDescription.content = 'إدارة الأكاديميات المعتمدة - نظام توثيق الشهادات';

            if (settings.logoUrl) {
                if (ogImage) ogImage.content = settings.logoUrl;
                if (twitterImage) twitterImage.content = settings.logoUrl;
                if (favicon) favicon.href = settings.logoUrl;
                if (appleIcon) appleIcon.href = settings.logoUrl;
            }
        }

        function applyColors(colors) {
            const root = document.documentElement;
            if (colors.primary) root.style.setProperty('--primary-color', colors.primary);
            if (colors.accent) root.style.setProperty('--accent-color', colors.accent);
            if (colors.background) root.style.setProperty('--bg-color', colors.background);
            if (colors.text) root.style.setProperty('--text-color', colors.text);
            if (colors.textSecondary) root.style.setProperty('--text-secondary', colors.textSecondary);
            if (colors.textMuted) root.style.setProperty('--text-muted', colors.textMuted);
            if (colors.textDim) root.style.setProperty('--text-dim', colors.textDim);
            if (colors.success) root.style.setProperty('--success', colors.success);
            if (colors.error) root.style.setProperty('--error', colors.error);
            if (colors.warning) root.style.setProperty('--warning', colors.warning);
            if (colors.info) root.style.setProperty('--info', colors.info);
            if (colors.border) root.style.setProperty('--border', colors.border);
            if (colors.cardBg) root.style.setProperty('--card-bg', colors.cardBg);

            const primaryGlow = colors.primary ? colors.primary + '30' : 'rgba(201,168,76,0.3)';
            root.style.setProperty('--primary-glow', primaryGlow);
            const accentGlow = colors.accent ? colors.accent + '20' : 'rgba(124,58,237,0.2)';
            root.style.setProperty('--accent-glow', accentGlow);

            if (colors.background) {
                document.body.style.background = colors.background;
            }
        }

        // ============================================================
        // 5. دوال البحث والفلترة
        // ============================================================
        function populateGovernorates() {
            const select = document.getElementById('searchGovernorate');
            if (!select) return;
            const govs = new Set();
            allAcademies.forEach(function(a) {
                if (a.branches) {
                    a.branches.forEach(function(b) {
                        if (b.governorate) govs.add(b.governorate);
                    });
                }
            });
            const firstOption = select.options[0];
            select.innerHTML = '';
            select.appendChild(firstOption);
            govs.forEach(function(g) {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                select.appendChild(opt);
            });
        }

        function applyFilters(e) {
            if (e) e.preventDefault();

            const nameFilter = document.getElementById('searchName').value.trim().toLowerCase();
            const licenseFilter = document.getElementById('searchLicense').value.trim().toLowerCase();
            const govFilter = document.getElementById('searchGovernorate').value;
            const statusFilter = document.getElementById('searchStatus').value;
            const taxFilter = document.getElementById('searchTax').value.trim().toLowerCase();
            const phoneFilter = document.getElementById('searchPhone').value.trim().toLowerCase();
            const sortBy = document.getElementById('sortBy').value;

            // حساب عدد الشهادات لكل أكاديمية
            const certCounts = {};
            // سيتم تحديثها من الشهادات لاحقاً

            filteredAcademies = allAcademies.filter(function(item) {
                let match = true;
                if (nameFilter) {
                    match = match && (item.name || '').toLowerCase().includes(nameFilter);
                }
                if (licenseFilter) {
                    match = match && (item.licenseNumber || '').toLowerCase().includes(licenseFilter);
                }
                if (govFilter) {
                    let hasGov = false;
                    if (item.branches) {
                        for (var i = 0; i < item.branches.length; i++) {
                            if (item.branches[i].governorate === govFilter) {
                                hasGov = true;
                                break;
                            }
                        }
                    }
                    match = match && hasGov;
                }
                if (statusFilter === 'active') {
                    match = match && item.isActive !== false;
                } else if (statusFilter === 'inactive') {
                    match = match && item.isActive === false;
                }
                if (taxFilter) {
                    match = match && (item.taxNumber || '').toLowerCase().includes(taxFilter);
                }
                if (phoneFilter) {
                    let hasPhone = false;
                    if (item.branches) {
                        for (var j = 0; j < item.branches.length; j++) {
                            if ((item.branches[j].phone || '').toLowerCase().includes(phoneFilter)) {
                                hasPhone = true;
                                break;
                            }
                        }
                    }
                    match = match && hasPhone;
                }
                return match;
            });

            // ترتيب
            filteredAcademies.sort(function(a, b) {
                if (sortBy === 'name') {
                    return (a.name || '').localeCompare(b.name || '');
                } else if (sortBy === 'license') {
                    return (a.licenseNumber || '').localeCompare(b.licenseNumber || '');
                } else if (sortBy === 'createdAt') {
                    const dateA = a.createdAt ? a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt) :
                        new Date(0);
                    const dateB = b.createdAt ? b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt) :
                        new Date(0);
                    return dateB - dateA;
                }
                return 0;
            });

            currentPage = 1;
            renderAcademies();
            updateResultCount();
        }

        function resetFilters() {
            document.getElementById('searchName').value = '';
            document.getElementById('searchLicense').value = '';
            document.getElementById('searchGovernorate').value = '';
            document.getElementById('searchStatus').value = 'all';
            document.getElementById('searchTax').value = '';
            document.getElementById('searchPhone').value = '';
            document.getElementById('sortBy').value = 'certCount';
            applyFilters();
        }

        function updateResultCount() {
            const countEl = document.getElementById('resultCount');
            if (countEl) {
                countEl.textContent = 'عرض ' + filteredAcademies.length + ' أكاديمية';
            }
        }

        // ============================================================
        // 6. عرض الأكاديميات
        // ============================================================
        function renderAcademies() {
            const container = document.getElementById('academiesGrid');
            if (!container) return;

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredAcademies.slice(start, end);
            const totalPages = Math.ceil(filteredAcademies.length / itemsPerPage);

            if (filteredAcademies.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <div class="icon">🏛️</div>
                        <h3>لا توجد أكاديميات</h3>
                        <p>لم يتم العثور على أكاديميات تطابق معايير البحث</p>
                    </div>
                `;
            } else {
                container.innerHTML = pageItems.map(function(item) {
                    const isActive = item.isActive !== false;
                    const statusClass = isActive ? 'active' : 'inactive';
                    const statusText = isActive ? 'نشط' : 'غير نشط';

                    const branches = item.branches || [];
                    const branchNames = branches.map(function(b) {
                        return b.governorate || 'فرع';
                    }).join(', ');

                    return `
                        <div class="academy-card">
                            <div class="card-header">
                                <div>
                                    <div class="name">${item.name || 'غير محدد'}</div>
                                    <span class="badge-status ${statusClass}">${statusText}</span>
                                </div>
                                <div class="license">${item.licenseNumber || 'لا يوجد'}</div>
                            </div>
                            <div class="card-body">
                                <div class="info-item">
                                    <div class="label">الرقم الاعتمادي</div>
                                    <div class="value">${item.licenseNumber || '-'}</div>
                                </div>
                                <div class="info-item">
                                    <div class="label">البطاقة الضريبية</div>
                                    <div class="value small">${item.taxNumber || '-'}</div>
                                </div>
                                <div class="info-item" style="grid-column:1/-1;">
                                    <div class="label">الفروع (${branches.length})</div>
                                    <div class="value small">${branchNames || 'لا توجد فروع'}</div>
                                </div>
                                ${branches.length > 0 ? branches.slice(0, 3).map(function(b) {
                                    return `<span class="branch-tag">${b.governorate || 'فرع'}</span>`;
                                }).join('') : ''}
                                ${branches.length > 3 ? `<span class="branch-tag">+${branches.length - 3}</span>` : ''}
                            </div>
                            <div class="card-footer">
                                <span class="cert-count">0 شهادة</span>
                                <div class="actions">
                                    <button class="btn btn-outline btn-sm" onclick="viewAcademy('${item.id}')">عرض</button>
                                    ${userRole === 'super_admin' ? `
                                    <button class="btn btn-primary btn-sm" onclick="editAcademy('${item.id}')">تعديل</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteAcademy('${item.id}')">حذف</button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('pageInfo').textContent = 'صفحة ' + currentPage + ' من ' + Math.max(totalPages, 1);
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            const totalPages = Math.ceil(filteredAcademies.length / itemsPerPage);
            const newPage = currentPage + delta;
            if (newPage < 1 || newPage > totalPages) return;
            currentPage = newPage;
            renderAcademies();
        }

        // ============================================================
        // 7. دوال الإجراءات
        // ============================================================
        function viewAcademy(id) {
            window.location.href = 'academy-details.html?id=' + id;
        }

        function editAcademy(id) {
            window.location.href = 'academy-edit.html?id=' + id;
        }

        function deleteAcademy(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الأكاديمية؟')) return;
            db.collection('academies').doc(id).update({
                isDeleted: true,
                deletedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(function() {
                showMsg('تم حذف الأكاديمية بنجاح', 'success');
            }).catch(function(err) {
                showMsg('حدث خطأ: ' + err.message, 'error');
            });
        }

        // ============================================================
        // 8. عرض الرسائل
        // ============================================================
        function showMsg(msg, type) {
            const el = document.getElementById('pageMsg');
            if (!el) return;
            el.textContent = msg;
            el.className = 'msg show ' + type;
            setTimeout(function() { el.className = 'msg'; }, 5000);
        }

        // ============================================================
        // 9. المصادقة والصلاحيات
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (user) {
                currentUser = user;
                db.collection('users').doc(user.uid).get()
                    .then(function(doc) {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.role === 'super_admin' || data.role === 'admin' || data.role === 'committee_manager') {
                                userRole = data.role;
                                const settingsBtn = document.getElementById('settingsBtn');
                                if (data.role === 'super_admin') {
                                    if (settingsBtn) settingsBtn.style.display = 'inline-flex';
                                } else {
                                    if (settingsBtn) settingsBtn.style.display = 'none';
                                }
                                startListeners();
                            } else {
                                showMsg('غير مصرح بالوصول إلى هذه الصفحة', 'error');
                                setTimeout(function() { window.location.href = 'home.html'; }, 2000);
                            }
                        } else {
                            showMsg('المستخدم غير موجود', 'error');
                            setTimeout(function() { window.location.href = 'login.html'; }, 2000);
                        }
                    })
                    .catch(function(err) {
                        showMsg('حدث خطأ: ' + err.message, 'error');
                    });
            } else {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            auth.signOut().then(function() {
                window.location.href = 'login.html';
            });
        });

        // ============================================================
        // 10. بدء التشغيل
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('صفحة الأكاديميات - جاري التحميل');
            console.log('تحديث فوري للبيانات');
            console.log('فلاتر بحث متقدمة');
            console.log('ترتيب حسب عدة معايير');
            console.log('🚫 تم منع قائمة النقر بزر الماوس الأيمن');
            console.log('🔒 صلاحيات: السوبر أدمن فقط يرى أزرار التعديل والحذف');
        });
    </script>

</body>
</html>
