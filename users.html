    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', 'Tahoma', sans-serif;
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
            background: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        :root {
            --primary-color: #C9A84C;
            --primary-dark: #A8893A;
            --primary-light: #E8D5A3;
            --primary-glow: rgba(201,168,76,0.3);
            --secondary-color: #0A1628;
            --accent-color: #7C3AED;
            --accent-light: #A78BFA;
            --accent-glow: rgba(124,58,237,0.2);
            --bg-color: #0A0E1A;
            --bg-card: rgba(255,255,255,0.04);
            --bg-hover: rgba(255,255,255,0.06);
            --text-color: #FFFFFF;
            --text-secondary: rgba(255,255,255,0.7);
            --text-muted: rgba(255,255,255,0.4);
            --text-dim: rgba(255,255,255,0.15);
            --success: #10B981;
            --success-bg: rgba(16,185,129,0.12);
            --error: #EF4444;
            --error-bg: rgba(239,68,68,0.12);
            --warning: #F59E0B;
            --warning-bg: rgba(245,158,11,0.12);
            --info: #3B82F6;
            --info-bg: rgba(59,130,246,0.12);
            --border: rgba(255,255,255,0.06);
            --border-light: rgba(255,255,255,0.03);
            --card-bg: rgba(255,255,255,0.04);
            --shadow: 0 20px 60px rgba(0,0,0,0.3);
            --radius: 20px;
            --radius-sm: 12px;
            --radius-lg: 28px;
        }

        .page-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 30%, var(--primary-glow) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, var(--accent-glow) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.04) 0%, transparent 60%);
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.04) rotate(1.5deg); opacity: 0.9; }
        }

        .page-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 600 600' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .particles-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particleFloat 22s infinite ease-in-out;
        }

        .particle:nth-child(1) { width: 6px; height: 6px; top: 5%; left: 5%; animation-delay: 0s; background: var(--primary-color); opacity: 0.3; }
        .particle:nth-child(2) { width: 8px; height: 8px; top: 15%; left: 30%; animation-delay: 2s; background: var(--accent-color); opacity: 0.3; }
        .particle:nth-child(3) { width: 4px; height: 4px; top: 25%; left: 70%; animation-delay: 4s; background: var(--primary-color); opacity: 0.4; }
        .particle:nth-child(4) { width: 7px; height: 7px; top: 40%; left: 10%; animation-delay: 1s; background: var(--accent-color); opacity: 0.25; }
        .particle:nth-child(5) { width: 5px; height: 5px; top: 50%; left: 85%; animation-delay: 3s; background: var(--primary-color); opacity: 0.3; }
        .particle:nth-child(6) { width: 9px; height: 9px; top: 65%; left: 20%; animation-delay: 5s; background: var(--accent-color); opacity: 0.25; }
        .particle:nth-child(7) { width: 4px; height: 4px; top: 75%; left: 60%; animation-delay: 2.5s; background: var(--primary-color); opacity: 0.4; }
        .particle:nth-child(8) { width: 6px; height: 6px; top: 88%; left: 40%; animation-delay: 4.5s; background: var(--accent-color); opacity: 0.3; }

        @keyframes particleFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
            20% { transform: translate(40px, -30px) scale(1.3); opacity: 0.6; }
            40% { transform: translate(-20px, -60px) scale(0.7); opacity: 0.3; }
            60% { transform: translate(50px, -20px) scale(1.4); opacity: 0.7; }
            80% { transform: translate(-30px, -80px) scale(0.8); opacity: 0.4; }
            100% { transform: translate(10px, 0) scale(1); opacity: 0.1; }
        }

        .grid-lines {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(201,168,76,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,168,76,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(30px) translateX(30px); }
        }

        .orbital-ring {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(201,168,76,0.04);
            animation: ringSpin 40s linear infinite;
        }

        .ring:nth-child(1) { width: 350px; height: 350px; border-color: rgba(201,168,76,0.06); }
        .ring:nth-child(2) { width: 550px; height: 550px; border-color: rgba(124,58,237,0.04); animation-duration: 50s; animation-direction: reverse; }
        .ring:nth-child(3) { width: 750px; height: 750px; border-color: rgba(59,130,246,0.03); animation-duration: 60s; }

        @keyframes ringSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }

        .glow-orb:nth-child(1) {
            width: 450px;
            height: 450px;
            top: -150px;
            right: -150px;
            background: var(--primary-glow);
        }

        .glow-orb:nth-child(2) {
            width: 550px;
            height: 550px;
            bottom: -200px;
            left: -200px;
            background: var(--accent-glow);
            animation-delay: 6s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(60px, 40px) scale(1.15); opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
        }

        .header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            animation: headerFloat 6s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, var(--primary-glow), transparent 50%);
            pointer-events: none;
        }

        @keyframes headerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .logo-box {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.4s ease;
            animation: logoSpin 20s linear infinite;
            box-shadow: 0 0 35px var(--primary-glow);
            position: relative;
            background-size: cover;
            background-position: center;
        }

        @keyframes logoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-box:hover {
            animation-duration: 3s;
            transform: scale(1.08);
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-color);
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-president {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 14px;
            background: var(--bg-hover);
            border-radius: 30px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .header-president:hover {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .header-president .president-icon { font-size: 16px; }
        .header-president .president-label { font-size: 11px; color: var(--text-muted); font-weight: 300; }
        .header-president .president-name {
            font-size: 13px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before { width: 300px; height: 300px; }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: #fff;
            box-shadow: 0 4px 25px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 40px var(--primary-glow); }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover { background: var(--bg-hover); border-color: var(--primary-color); transform: translateY(-3px); }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: #fff;
            box-shadow: 0 4px 25px rgba(16,185,129,0.25);
        }
        .btn-success:hover { transform: translateY(-3px) scale(1.02); }

        .btn-danger {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: #fff;
            box-shadow: 0 4px 25px rgba(239,68,68,0.25);
        }
        .btn-danger:hover { transform: translateY(-3px) scale(1.02); }

        .btn-sm { padding: 5px 14px; font-size: 12px; }

        .role-badge {
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 20px;
            background: var(--primary-glow);
            color: var(--primary-color);
            font-weight: 600;
        }

        .page-title-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .page-title-section h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-color) 0%, var(--primary-color) 40%, var(--accent-light) 70%, var(--text-color) 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleFlow 5s ease-in-out infinite;
        }

        @keyframes titleFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .page-title-section p {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 300;
        }

        .search-section {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .search-section:hover {
            border-color: var(--primary-color);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }

        .search-grid input,
        .search-grid select {
            width: 100%;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--bg-hover);
            color: var(--text-color);
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-grid input::placeholder {
            color: var(--text-muted);
        }

        .search-grid input:focus,
        .search-grid select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow);
            background: rgba(255,255,255,0.06);
        }

        .search-grid select option {
            background: var(--bg-color);
            color: var(--text-color);
        }

        .search-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            transition: all 0.4s ease;
            text-align: center;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }

        .stat-card .stat-number {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-color), var(--primary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .stat-card .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 300;
        }

        .stat-card .stat-online {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 1.5s ease-in-out infinite;
            margin-right: 4px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .user-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .user-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, var(--primary-glow), transparent 50%);
            pointer-events: none;
        }

        .user-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }

        .user-card .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .user-card .user-header .user-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
        }

        .user-card .user-header .user-role {
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .user-role.super_admin { background: rgba(139,92,246,0.2); color: #8b5cf6; }
        .user-role.admin { background: rgba(59,130,246,0.2); color: #3b82f6; }
        .user-role.committee_manager { background: rgba(16,185,129,0.2); color: #10b981; }
        .user-role.user { background: var(--bg-hover); color: var(--text-muted); }

        .user-card .user-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
            margin-bottom: 10px;
        }

        .user-card .user-body .info-item {
            padding: 4px 0;
        }

        .user-card .user-body .info-item .label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-card .user-body .info-item .value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
        }

        .user-card .user-body .info-item .value .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 4px;
        }

        .user-card .user-body .info-item .value .online-dot.online {
            background: var(--success);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .user-card .user-body .info-item .value .online-dot.offline {
            background: var(--text-dim);
        }

        .user-card .user-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .user-card .user-footer .session-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .user-card .user-footer .actions {
            display: flex;
            gap: 4px;
        }

        .user-card .user-footer .actions .btn {
            padding: 3px 10px;
            font-size: 11px;
            border-radius: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .pagination button {
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--bg-hover);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--primary-glow);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination span {
            color: var(--text-muted);
            font-size: 14px;
        }

        .msg {
            display: none;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
        }

        .msg.show { display: block; animation: fadeIn 0.3s ease; }

    <script>

        document.addEventListener('contextmenu', function(e) {

        });

        // ============================================================
        // 1. تهيئة Firebase
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBfrK1IBCk2mim6cVbbtSd1e4FOQcpYQeo",
            authDomain: "itwsaccertification.firebaseapp.com",
            projectId: "itwsaccertification",
            storageBucket: "itwsaccertification.firebasestorage.app",
            messagingSenderId: "521196512526",
            appId: "1:521196512526:web:b78b06dd87cf4f5ca1e35f",
            measurementId: "G-JBMGW74DV4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================

        let currentUser = null;
        let userRole = null;
        let allUsers = [];

        const itemsPerPage = 9;

        let settings = {
            headerTitle: 'إدارة المستخدمين',
            committeeName: 'لجنة التحول الرقمي والتدريب',
            logoUrl: '',

            presidentName: 'المهندس / محمود جميل',

            logoutBtn: 'تسجيل الخروج',
            settingsBtn: 'الإعدادات',

            pageSubtitle: 'مراقبة المستخدمين، حالتهم، أوقات الجلسات، والتحكم في صلاحياتهم',
            loaderText: 'جاري تحميل المستخدمين...',
            presidentFooter: 'النقيب العام:',
            colors: {
                primary: '#C9A84C',
                accent: '#7C3AED',

                text: '#FFFFFF',

                warning: '#F59E0B',
                info: '#3B82F6',
                border: 'rgba(255,255,255,0.06)',

            }
        };

        let isReady = false;

        // ============================================================
        // 3. إعدادات الـ Listeners
        // ============================================================
        let generalUnsubscribe = null;
        let designUnsubscribe = null;
        let usersUnsubscribe = null;
        let sessionsUnsubscribe = null;

        function startListeners() {
            let loadedCount = 0;
            const totalDocs = 4;

            function checkReady() {
                loadedCount++;
                if (loadedCount >= totalDocs && !isReady) {
                    isReady = true;
                    document.getElementById('pageLoader').classList.remove('show');
                    console.log('تم تحميل كل البيانات بنجاح');
                }
            }

            if (generalUnsubscribe) generalUnsubscribe();
            generalUnsubscribe = db.collection('settings').doc('general').onSnapshot(function(doc) {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.headerTitle) settings.headerTitle = data.headerTitle;
                    if (data.committeeName) settings.committeeName = data.committeeName;
                    if (data.logoUrl) settings.logoUrl = data.logoUrl;
                    if (data.footerText) settings.footerText = data.footerText;
                    if (data.presidentName) settings.presidentName = data.presidentName;
                    if (data.presidentLabel) settings.presidentLabel = data.presidentLabel;
                    if (data.colors) settings.colors = { ...settings.colors, ...data.colors };
                }
                applySettings();
                applyColors(settings.colors);
                if (!isReady) checkReady();
                console.log('تحديث فوري: الإعدادات العامة');
            }, function(error) {
                console.warn('خطأ في الاستماع للإعدادات العامة:', error);
                if (!isReady) checkReady();
            });

            if (designUnsubscribe) designUnsubscribe();
            designUnsubscribe = db.collection('settings').doc('design').onSnapshot(function(doc) {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.colors) {
                        settings.colors = { ...settings.colors, ...data.colors };
                    }
                }
                applyColors(settings.colors);
                if (!isReady) checkReady();
                console.log('تحديث فوري: التصميم');
            }, function(error) {
                console.warn('خطأ في الاستماع للتصميم:', error);
                if (!isReady) checkReady();
            });

            if (usersUnsubscribe) usersUnsubscribe();
            usersUnsubscribe = db.collection('users').where('isActive', '!=', false).onSnapshot(function(snapshot) {
                allUsers = [];
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    data.id = doc.id;
                    allUsers.push(data);
                });
                applyFilters();
                updateStats();
                if (!isReady) checkReady();
                console.log('تحديث فوري: المستخدمين (' + allUsers.length + ')');
            }, function(error) {
                console.warn('خطأ في الاستماع للمستخدمين:', error);
                if (!isReady) checkReady();
            });

            if (sessionsUnsubscribe) sessionsUnsubscribe();
            sessionsUnsubscribe = db.collection('sessions').where('isActive', '==', true).onSnapshot(function(snapshot) {
                onlineUsers = {};
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    if (data.userId) {
                        onlineUsers[data.userId] = {
                            sessionId: doc.id,
                            startedAt: data.startedAt,
                            lastActivity: data.lastActivity || data.startedAt
                        };
                    }
                });
                applyFilters();
                updateStats();
                console.log('تحديث فوري: الجلسات النشطة (' + Object.keys(onlineUsers).length + ')');
            }, function(error) {
                console.warn('خطأ في الاستماع للجلسات:', error);
            });
        }

        // ============================================================
        // 4. تطبيق الإعدادات
        // ============================================================
        function applySettings() {
            const titleEl = document.getElementById('headerTitle');
            const committeeEl = document.getElementById('committeeName');
            const presidentLabelEl = document.getElementById('presidentLabel');
            const presidentNameEl = document.getElementById('headerPresidentName');
            const footerTextEl = document.getElementById('footerText');
            const presidentFooterEl = document.getElementById('presidentFooter');
            const presidentNameFooterEl = document.getElementById('presidentName');
            const dashboardBtn = document.getElementById('dashboardBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const roleBadge = document.getElementById('roleBadge');
            const pageTitleMain = document.getElementById('pageTitleMain');
            const pageSubtitle = document.getElementById('pageSubtitle');
            const loaderText = document.getElementById('loaderText');

            if (titleEl) titleEl.textContent = settings.headerTitle;
            if (committeeEl) committeeEl.textContent = settings.committeeName;
            if (presidentLabelEl) presidentLabelEl.textContent = settings.presidentLabel;
            if (presidentNameEl) presidentNameEl.textContent = settings.presidentName;
            if (footerTextEl) footerTextEl.textContent = settings.footerText;
            if (presidentFooterEl) presidentFooterEl.textContent = settings.presidentFooter;
            if (presidentNameFooterEl) presidentNameFooterEl.textContent = settings.presidentName;

            if (dashboardBtn) dashboardBtn.textContent = settings.dashboardBtn;
            if (logoutBtn) logoutBtn.textContent = settings.logoutBtn;
            if (settingsBtn) settingsBtn.textContent = settings.settingsBtn;
            if (pageTitleMain) pageTitleMain.textContent = settings.pageTitleMain;
            if (pageSubtitle) pageSubtitle.textContent = settings.pageSubtitle;
            if (loaderText) loaderText.textContent = settings.loaderText;

            if (roleBadge) {
                if (userRole === 'super_admin') {
                    roleBadge.textContent = 'سوبر أدمن';
                    roleBadge.style.background = 'rgba(139,92,246,0.15)';
                    roleBadge.style.color = '#8b5cf6';
                } else if (userRole === 'admin') {
                    roleBadge.textContent = 'أدمن';
                } else {
                    roleBadge.textContent = 'إدارة اللجنة';
                }
            }

            if (settings.logoUrl) {
                const logo = document.getElementById('logoBox');
                if (logo) {
                    logo.style.backgroundImage = 'url(' + settings.logoUrl + ')';
                    logo.style.backgroundSize = 'cover';
                    logo.style.backgroundPosition = 'center';
                    logo.textContent = '';
                }
            }

            const pageTitle = document.getElementById('pageTitle');
            if (pageTitle) {
                pageTitle.textContent = 'نقابة تكنولوجيا المعلومات والبرمجيات - المستخدمين';
            }

            const ogTitle = document.getElementById('ogTitle');
            const ogDescription = document.getElementById('ogDescription');
            const ogImage = document.getElementById('ogImage');
            const ogUrl = document.getElementById('ogUrl');
            const ogSiteName = document.getElementById('ogSiteName');
            const twitterTitle = document.getElementById('twitterTitle');
            const twitterDescription = document.getElementById('twitterDescription');
            const twitterImage = document.getElementById('twitterImage');
            const favicon = document.getElementById('favicon');
            const appleIcon = document.getElementById('appleIcon');

            if (ogTitle) ogTitle.content = 'نقابة تكنولوجيا المعلومات والبرمجيات - المستخدمين';
            if (ogDescription) ogDescription.content = 'إدارة المستخدمين - نظام توثيق الشهادات';
            if (ogUrl) ogUrl.content = window.location.href;
            if (ogSiteName) ogSiteName.content = 'نقابة تكنولوجيا المعلومات والبرمجيات';
            if (twitterTitle) twitterTitle.content = 'نقابة تكنولوجيا المعلومات والبرمجيات - المستخدمين';
            if (twitterDescription) twitterDescription.content = 'إدارة المستخدمين - نظام توثيق الشهادات';

            if (settings.logoUrl) {
                if (ogImage) ogImage.content = settings.logoUrl;
                if (twitterImage) twitterImage.content = settings.logoUrl;
                if (favicon) favicon.href = settings.logoUrl;
                if (appleIcon) appleIcon.href = settings.logoUrl;
            }
        }

        function applyColors(colors) {
            const root = document.documentElement;
            if (colors.primary) root.style.setProperty('--primary-color', colors.primary);
            if (colors.accent) root.style.setProperty('--accent-color', colors.accent);
            if (colors.background) root.style.setProperty('--bg-color', colors.background);
            if (colors.text) root.style.setProperty('--text-color', colors.text);
            if (colors.textSecondary) root.style.setProperty('--text-secondary', colors.textSecondary);
            if (colors.textMuted) root.style.setProperty('--text-muted', colors.textMuted);
            if (colors.textDim) root.style.setProperty('--text-dim', colors.textDim);
            if (colors.success) root.style.setProperty('--success', colors.success);
            if (colors.error) root.style.setProperty('--error', colors.error);
            if (colors.warning) root.style.setProperty('--warning', colors.warning);
            if (colors.info) root.style.setProperty('--info', colors.info);
            if (colors.border) root.style.setProperty('--border', colors.border);
            if (colors.cardBg) root.style.setProperty('--card-bg', colors.cardBg);

            const primaryGlow = colors.primary ? colors.primary + '30' : 'rgba(201,168,76,0.3)';
            root.style.setProperty('--primary-glow', primaryGlow);
            const accentGlow = colors.accent ? colors.accent + '20' : 'rgba(124,58,237,0.2)';
            root.style.setProperty('--accent-glow', accentGlow);

            if (colors.background) {
                document.body.style.background = colors.background;
            }
        }

        // ============================================================
        // 5. دوال البحث والفلترة
        // ============================================================
        function applyFilters(e) {
            if (e) e.preventDefault();

            const nameFilter = document.getElementById('searchName').value.trim().toLowerCase();
            const emailFilter = document.getElementById('searchEmail').value.trim().toLowerCase();
            const roleFilter = document.getElementById('searchRole').value;
            const statusFilter = document.getElementById('searchStatus').value;

            filteredUsers = allUsers.filter(function(item) {
                let match = true;
                if (nameFilter) {
                    match = match && (item.name || item.fullName || '').toLowerCase().includes(nameFilter);
                }
                if (emailFilter) {
                    match = match && (item.email || '').toLowerCase().includes(emailFilter);
                }
                if (roleFilter) {
                    match = match && (item.role || '') === roleFilter;
                }
                if (statusFilter === 'online') {
                    match = match && onlineUsers[item.id] !== undefined;
                } else if (statusFilter === 'offline') {
                    match = match && onlineUsers[item.id] === undefined;
                } else if (statusFilter === 'active') {
                    match = match && item.isActive !== false;
                } else if (statusFilter === 'inactive') {
                    match = match && item.isActive === false;
                }
                return match;
            });

            currentPage = 1;
            renderUsers();
            updateStats();
        }

        function resetFilters() {
            document.getElementById('searchName').value = '';
            document.getElementById('searchEmail').value = '';
            document.getElementById('searchRole').value = '';
            document.getElementById('searchStatus').value = 'all';
            applyFilters();
        }

        function updateStats() {
            const total = allUsers.length;
            const online = Object.keys(onlineUsers).length;
            const admins = allUsers.filter(function(u) { return u.role === 'super_admin' || u.role === 'admin'; }).length;

            const today = new Date();
            today.setHours(today.getHours() - 24);
            let activeToday = 0;
            Object.keys(onlineUsers).forEach(function(key) {
                const session = onlineUsers[key];
                if (session.lastActivity) {
                    const lastAct = session.lastActivity.toDate ? session.lastActivity.toDate() : new Date(session
                        .lastActivity);
                    if (lastAct >= today) activeToday++;
                }
            });

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statOnline').innerHTML = '<span class="stat-online"></span> ' + online;
            document.getElementById('statAdmins').textContent = admins;
            document.getElementById('statActive').textContent = activeToday || online;
        }

        // ============================================================
        // 6. عرض المستخدمين
        // ============================================================
        function renderUsers() {
            const container = document.getElementById('usersGrid');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredUsers.slice(start, end);
            const totalPages = Math.ceil(filteredUsers.length / itemsPerPage);

            if (filteredUsers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">👤</div>
                        <h3>لا يوجد مستخدمين</h3>
                        <p>لم يتم العثور على مستخدمين تطابق معايير البحث</p>
                    </div>
                `;
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            document.getElementById('pagination').style.display = 'flex';

            container.innerHTML = pageItems.map(function(item) {
                const isOnline = onlineUsers[item.id] !== undefined;
                const roleClass = item.role || 'user';
                const roleLabels = {
                    'super_admin': 'سوبر أدمن',
                    'admin': 'أدمن',
                    'committee_manager': 'إدارة اللجنة',
                    'user': 'مستخدم'
                };

                let sessionTime = 'غير متصل';
                if (isOnline) {
                    const session = onlineUsers[item.id];
                    if (session.startedAt) {
                        const startTime = session.startedAt.toDate ? session.startedAt.toDate() : new Date(session
                            .startedAt);
                        const now = new Date();
                        const diff = Math.floor((now - startTime) / 1000 / 60);
                        if (diff < 60) {
                            sessionTime = diff + ' دقيقة';
                        } else if (diff < 1440) {
                            sessionTime = Math.floor(diff / 60) + ' ساعة';
                        } else {
                            sessionTime = Math.floor(diff / 1440) + ' يوم';
                        }
                    } else {
                        sessionTime = 'متصل';
                    }
                }

                const lastSeen = item.lastLoginAt ? formatDateTime(item.lastLoginAt) : 'لم يسجل بعد';

                return `
                    <div class="user-card">
                        <div class="user-header">
                            <div>
                                <div class="user-name">${item.name || item.fullName || 'مستخدم'}</div>
                                <span class="user-role ${roleClass}">${roleLabels[roleClass] || roleClass}</span>
                            </div>
                            <div>
                                <span class="user-role" style="background:${isOnline ? 'var(--success-bg)' : 'var(--bg-hover)'};color:${isOnline ? 'var(--success)' : 'var(--text-muted)'}">
                                    ${isOnline ? '🟢 متصل' : '🔴 غير متصل'}
                                </span>
                            </div>
                        </div>
                        <div class="user-body">
                            <div class="info-item">
                                <div class="label">البريد الإلكتروني</div>
                                <div class="value" style="font-size:12px;color:var(--text-muted);">${item.email || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">آخر ظهور</div>
                                <div class="value" style="font-size:12px;color:var(--text-muted);">${lastSeen}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">مدة الجلسة الحالية</div>
                                <div class="value" style="font-size:12px;color:var(--text-muted);">${sessionTime}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">الحالة</div>
                                <div class="value" style="font-size:12px;">
                                    ${item.isActive !== false ? 
                                        '<span style="color:var(--success);">نشط</span>' : 
                                        '<span style="color:var(--error);">غير نشط</span>'}
                                </div>
                            </div>
                        </div>
                        <div class="user-footer">
                            <div class="session-time">
                                ${isOnline ? '🟢 متصل الآن' : 'آخر نشاط: ' + lastSeen}
                            </div>
                            <div class="actions">
                                ${userRole === 'super_admin' ? `
                                <button class="btn btn-primary btn-sm" onclick="editUser('${item.id}')">تعديل</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteUser('${item.id}')">حذف</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('pageInfo').textContent = 'صفحة ' + currentPage + ' من ' + Math.max(totalPages, 1);
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            const totalPages = Math.ceil(filteredUsers.length / itemsPerPage);
            const newPage = currentPage + delta;
            if (newPage < 1 || newPage > totalPages) return;
            currentPage = newPage;
            renderUsers();
        }

        function formatDateTime(date) {
            if (!date) return '-';
            const d = date.toDate ? date.toDate() : new Date(date);
            return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit',
                minute: '2-digit' });
        }

        // ============================================================
        // 7. إدارة المستخدمين
        // ============================================================
        function openAddModal() {
            if (userRole !== 'super_admin') {
                showMsg('غير مصرح لك بإضافة مستخدمين', 'error');
                return;
            }
            document.getElementById('modalTitle').textContent = 'إضافة مستخدم جديد';
            document.getElementById('editUserId').value = '';
            document.getElementById('userName').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userPassword').value = '';
            document.getElementById('userPassword').placeholder = 'أدخل كلمة المرور (8 أحرف على الأقل)';
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('userRole').value = 'user';
            document.getElementById('userStatus').value = 'true';
            document.getElementById('saveBtn').textContent = 'إضافة';
            document.getElementById('userModal').classList.add('active');
        }

        function editUser(id) {
            if (userRole !== 'super_admin') {
                showMsg('غير مصرح لك بتعديل المستخدمين', 'error');
                return;
            }
            const user = allUsers.find(function(u) { return u.id === id; });
            if (!user) {
                showMsg('المستخدم غير موجود', 'error');
                return;
            }

            document.getElementById('modalTitle').textContent = 'تعديل مستخدم';
            document.getElementById('editUserId').value = id;
            document.getElementById('userName').value = user.name || user.fullName || '';
            document.getElementById('userEmail').value = user.email || '';
            document.getElementById('userPassword').value = '';
            document.getElementById('userPassword').placeholder = 'اتركها فارغة لتغييرها';
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('userRole').value = user.role || 'user';
            document.getElementById('userStatus').value = user.isActive !== false ? 'true' : 'false';
            document.getElementById('saveBtn').textContent = 'تحديث';
            document.getElementById('userModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        function saveUser(e) {
            e.preventDefault();

            const id = document.getElementById('editUserId').value;
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value.trim();
            const role = document.getElementById('userRole').value;
            const isActive = document.getElementById('userStatus').value === 'true';

            if (!name || !email) {
                showMsg('الرجاء ملء جميع الحقول المطلوبة', 'error');
                return false;
            }

            if (!id && (!password || password.length < 8)) {
                showMsg('كلمة المرور يجب أن تكون 8 أحرف على الأقل', 'error');
                return false;
            }

            const userData = {
                name: name,
                fullName: name,
                email: email,
                role: role,
                isActive: isActive,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (id) {
                db.collection('users').doc(id).update(userData)
                    .then(function() {
                        if (password && password.length >= 8) {
                            return auth.currentUser ? auth.currentUser.updatePassword(password) : Promise.resolve();
                        }
                        return Promise.resolve();
                    })
                    .then(function() {
                        showMsg('تم تحديث المستخدم بنجاح', 'success');
                        closeModal();
                        db.collection('activities').add({
                            type: 'update_user',
                            userName: currentUser ? currentUser.displayName || 'مستخدم' : 'مستخدم',
                            userId: currentUser ? currentUser.uid : '',
                            description: 'تعديل مستخدم: ' + name,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        }).catch(function() {});
                    })
                    .catch(function(err) {
                        showMsg('حدث خطأ: ' + err.message, 'error');
                    });
            } else {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(function(cred) {
                        const uid = cred.user.uid;
                        userData.uid = uid;
                        userData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                        return db.collection('users').doc(uid).set(userData);
                    })
                    .then(function() {
                        showMsg('تم إضافة المستخدم بنجاح', 'success');
                        closeModal();
                        db.collection('activities').add({
                            type: 'create_user',
                            userName: currentUser ? currentUser.displayName || 'مستخدم' : 'مستخدم',
                            userId: currentUser ? currentUser.uid : '',
                            description: 'إضافة مستخدم جديد: ' + name,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        }).catch(function() {});
                    })
                    .catch(function(err) {
                        let msg = 'حدث خطأ: ' + err.message;
                        if (err.code === 'auth/email-already-in-use') {
                            msg = 'البريد الإلكتروني مستخدم بالفعل';
                        }
                        showMsg(msg, 'error');
                    });
            }

            return false;
        }

        function deleteUser(id) {
            if (userRole !== 'super_admin') {
                showMsg('غير مصرح لك بحذف المستخدمين', 'error');
                return;
            }

            if (id === currentUser.uid) {
                showMsg('لا يمكنك حذف حسابك بنفسك', 'error');
                return;
            }

            const user = allUsers.find(function(u) { return u.id === id; });
            if (!user) {
                showMsg('المستخدم غير موجود', 'error');
                return;
            }

            if (!confirm('هل أنت متأكد من حذف المستخدم "' + (user.name || user.fullName || '') + '"؟')) return;

            db.collection('users').doc(id).update({
                isActive: false,
                deletedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(function() {
                showMsg('تم حذف المستخدم بنجاح', 'success');
                db.collection('activities').add({
                    type: 'delete_user',
                    userName: currentUser ? currentUser.displayName || 'مستخدم' : 'مستخدم',
                    userId: currentUser ? currentUser.uid : '',
                    description: 'حذف مستخدم: ' + (user.name || user.fullName || ''),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(function() {});
            }).catch(function(err) {
                showMsg('حدث خطأ: ' + err.message, 'error');
            });
        }

        // ============================================================
        // 8. عرض الرسائل
        // ============================================================
        function showMsg(msg, type) {
            const el = document.getElementById('pageMsg');
            if (!el) return;
            el.textContent = msg;
            el.className = 'msg show ' + type;
            setTimeout(function() { el.className = 'msg'; }, 5000);
        }

        // ============================================================
        // 9. المصادقة
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (user) {
                currentUser = user;
                db.collection('users').doc(user.uid).get()
                    .then(function(doc) {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.role === 'super_admin') {
                                userRole = data.role;
                                const settingsBtn = document.getElementById('settingsBtn');
                                if (settingsBtn) settingsBtn.style.display = 'inline-flex';
                                startListeners();
                            } else {
                                showMsg('غير مصرح بالوصول إلى هذه الصفحة', 'error');
                                setTimeout(function() { window.location.href = 'home.html'; }, 2000);
                            }
                        } else {
                            showMsg('المستخدم غير موجود', 'error');
                            setTimeout(function() { window.location.href = 'login.html'; }, 2000);
                        }
                    })
                    .catch(function(err) {
                        showMsg('حدث خطأ: ' + err.message, 'error');
                    });
            } else {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            auth.signOut().then(function() {
                window.location.href = 'login.html';
            });
        });

        // ============================================================
        // 10. بدء التشغيل
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('صفحة المستخدمين - جاري التحميل');
            console.log('تحديث فوري للبيانات');
            console.log('مراقبة المتصلين لحظياً');
            console.log('إحصائيات المستخدمين');
            console.log('🚫 تم منع قائمة النقر بزر الماوس الأيمن');
        });
    </script>

</body>
</html>
