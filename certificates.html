    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', 'Tahoma', sans-serif;
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
            background: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        :root {
            --primary-color: #C9A84C;
            --primary-dark: #A8893A;
            --primary-light: #E8D5A3;
            --primary-glow: rgba(201,168,76,0.3);
            --secondary-color: #0A1628;
            --accent-color: #7C3AED;
            --accent-light: #A78BFA;
            --accent-glow: rgba(124,58,237,0.2);
            --bg-color: #0A0E1A;
            --bg-card: rgba(255,255,255,0.04);
            --bg-hover: rgba(255,255,255,0.06);
            --text-color: #FFFFFF;
            --text-secondary: rgba(255,255,255,0.7);
            --text-muted: rgba(255,255,255,0.4);
            --text-dim: rgba(255,255,255,0.15);
            --success: #10B981;
            --success-bg: rgba(16,185,129,0.12);
            --error: #EF4444;
            --error-bg: rgba(239,68,68,0.12);
            --warning: #F59E0B;
            --warning-bg: rgba(245,158,11,0.12);
            --info: #3B82F6;
            --info-bg: rgba(59,130,246,0.12);
            --border: rgba(255,255,255,0.06);
            --border-light: rgba(255,255,255,0.03);
            --card-bg: rgba(255,255,255,0.04);
            --shadow: 0 20px 60px rgba(0,0,0,0.3);
            --radius: 20px;
            --radius-sm: 12px;
            --radius-lg: 28px;
        }

        .page-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 30%, var(--primary-glow) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, var(--accent-glow) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.04) 0%, transparent 60%);
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.04) rotate(1.5deg); opacity: 0.9; }
        }

        .page-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 600 600' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .particles-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particleFloat 22s infinite ease-in-out;
        }

        .particle:nth-child(1) { width: 6px; height: 6px; top: 5%; left: 5%; animation-delay: 0s; background: var(--primary-color); opacity: 0.3; }
        .particle:nth-child(2) { width: 8px; height: 8px; top: 15%; left: 30%; animation-delay: 2s; background: var(--accent-color); opacity: 0.3; }
        .particle:nth-child(3) { width: 4px; height: 4px; top: 25%; left: 70%; animation-delay: 4s; background: var(--primary-color); opacity: 0.4; }
        .particle:nth-child(4) { width: 7px; height: 7px; top: 40%; left: 10%; animation-delay: 1s; background: var(--accent-color); opacity: 0.25; }
        .particle:nth-child(5) { width: 5px; height: 5px; top: 50%; left: 85%; animation-delay: 3s; background: var(--primary-color); opacity: 0.3; }
        .particle:nth-child(6) { width: 9px; height: 9px; top: 65%; left: 20%; animation-delay: 5s; background: var(--accent-color); opacity: 0.25; }
        .particle:nth-child(7) { width: 4px; height: 4px; top: 75%; left: 60%; animation-delay: 2.5s; background: var(--primary-color); opacity: 0.4; }
        .particle:nth-child(8) { width: 6px; height: 6px; top: 88%; left: 40%; animation-delay: 4.5s; background: var(--accent-color); opacity: 0.3; }

        @keyframes particleFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
            20% { transform: translate(40px, -30px) scale(1.3); opacity: 0.6; }
            40% { transform: translate(-20px, -60px) scale(0.7); opacity: 0.3; }
            60% { transform: translate(50px, -20px) scale(1.4); opacity: 0.7; }
            80% { transform: translate(-30px, -80px) scale(0.8); opacity: 0.4; }
            100% { transform: translate(10px, 0) scale(1); opacity: 0.1; }
        }

        .grid-lines {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(201,168,76,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,168,76,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(30px) translateX(30px); }
        }

        .orbital-ring {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(201,168,76,0.04);
            animation: ringSpin 40s linear infinite;
        }

        .ring:nth-child(1) { width: 350px; height: 350px; border-color: rgba(201,168,76,0.06); }
        .ring:nth-child(2) { width: 550px; height: 550px; border-color: rgba(124,58,237,0.04); animation-duration: 50s; animation-direction: reverse; }
        .ring:nth-child(3) { width: 750px; height: 750px; border-color: rgba(59,130,246,0.03); animation-duration: 60s; }

        @keyframes ringSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }

        .glow-orb:nth-child(1) {
            width: 450px;
            height: 450px;
            top: -150px;
            right: -150px;
            background: var(--primary-glow);
        }

        .glow-orb:nth-child(2) {
            width: 550px;
            height: 550px;
            bottom: -200px;
            left: -200px;
            background: var(--accent-glow);
            animation-delay: 6s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(60px, 40px) scale(1.15); opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
        }

        .header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            animation: headerFloat 6s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, var(--primary-glow), transparent 50%);
            pointer-events: none;
        }

        @keyframes headerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .logo-box {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.4s ease;
            animation: logoSpin 20s linear infinite;
            box-shadow: 0 0 35px var(--primary-glow);
            position: relative;
            background-size: cover;
            background-position: center;
        }

        @keyframes logoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-box:hover {
            animation-duration: 3s;
            transform: scale(1.08);
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-color);
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-president {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 14px;
            background: var(--bg-hover);
            border-radius: 30px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .header-president:hover {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .header-president .president-icon { font-size: 16px; }
        .header-president .president-label { font-size: 11px; color: var(--text-muted); font-weight: 300; }
        .header-president .president-name {
            font-size: 13px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before { width: 300px; height: 300px; }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: #fff;
            box-shadow: 0 4px 25px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 40px var(--primary-glow); }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover { background: var(--bg-hover); border-color: var(--primary-color); transform: translateY(-3px); }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: #fff;
            box-shadow: 0 4px 25px rgba(16,185,129,0.25);
        }
        .btn-success:hover { transform: translateY(-3px) scale(1.02); }

        .btn-danger {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: #fff;
            box-shadow: 0 4px 25px rgba(239,68,68,0.25);
        }
        .btn-danger:hover { transform: translateY(-3px) scale(1.02); }

        .btn-sm { padding: 5px 14px; font-size: 12px; }

        .role-badge {
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 20px;
            background: var(--primary-glow);
            color: var(--primary-color);
            font-weight: 600;
        }

        .page-title-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .page-title-section h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-color) 0%, var(--primary-color) 40%, var(--accent-light) 70%, var(--text-color) 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleFlow 5s ease-in-out infinite;
        }

        @keyframes titleFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .page-title-section p {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 300;
        }

        .search-section {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .search-section:hover {
            border-color: var(--primary-color);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .search-grid .full-width {
            grid-column: 1 / -1;
        }

        .search-grid input,
        .search-grid select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--bg-hover);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-grid input::placeholder {
            color: var(--text-muted);
        }

        .search-grid input:focus,
        .search-grid select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow);
            background: rgba(255,255,255,0.06);
        }

        .search-grid select option {
            background: var(--bg-color);
            color: var(--text-color);
        }

        .search-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .certificate-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .certificate-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, var(--primary-glow), transparent 50%);
            pointer-events: none;
        }

        .certificate-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }

        .certificate-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .certificate-card .card-header .code {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
        }

        .certificate-card .card-header .status {
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .certificate-card .card-header .status.active {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(16,185,129,0.2);
        }

        .certificate-card .card-header .status.inactive {
            background: var(--error-bg);
            color: var(--error);
            border: 1px solid rgba(239,68,68,0.2);
        }

        .certificate-card .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            margin-bottom: 10px;
        }

        .certificate-card .card-body .info-item {
            padding: 4px 0;
        }

        .certificate-card .card-body .info-item .label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .certificate-card .card-body .info-item .value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
        }

        .certificate-card .card-body .info-item .value.grade-a { color: var(--success); }
        .certificate-card .card-body .info-item .value.grade-b { color: var(--info); }
        .certificate-card .card-body .info-item .value.grade-c { color: var(--warning); }
        .certificate-card .card-body .info-item .value.grade-d { color: #f97316; }
        .certificate-card .card-body .info-item .value.grade-f { color: var(--error); }

        .certificate-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .certificate-card .card-footer .date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .certificate-card .card-footer .actions {
            display: flex;
            gap: 4px;
        }

        .certificate-card .card-footer .actions .btn {
            padding: 3px 10px;
            font-size: 11px;
            border-radius: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .pagination button {
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--bg-hover);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--primary-glow);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination span {
            color: var(--text-muted);
            font-size: 14px;
        }

        .msg {
            display: none;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
        }

        .msg.show { display: block; animation: fadeIn 0.3s ease; }
        .msg.error { background: var(--error-bg); border: 1px solid var(--error); color: var(--error); }
        .msg.success { background: var(--success-bg); border: 1px solid var(--success); color: var(--success); }
        .msg.info { background: var(--info-bg); border: 1px solid var(--info); color: var(--info); }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .loader { display: none; text-align: center; padding: 30px 0; }
        .loader.show { display: block; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            text-align: center;
            padding: 20px 0 10px;
            border-top: 1px solid var(--border);
            margin-top: 24px;
            color: var(--text-dim);
            font-size: 11px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .empty-state h3 {

    <script>
        // ============================================================
        // منع قائمة النقر بزر الماوس الأيمن
        // ============================================================
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // ============================================================
        // 1. تهيئة Firebase
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBfrK1IBCk2mim6cVbbtSd1e4FOQcpYQeo",
            authDomain: "itwsaccertification.firebaseapp.com",
            projectId: "itwsaccertification",
            storageBucket: "itwsaccertification.firebasestorage.app",
            messagingSenderId: "521196512526",
            appId: "1:521196512526:web:b78b06dd87cf4f5ca1e35f",
            measurementId: "G-JBMGW74DV4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // 2. متغيرات
        // ============================================================
        let currentUser = null;
        let userRole = null;
        let allCertificates = [];
        let allAcademies = [];
        let filteredCertificates = [];
        let currentPage = 1;
        const itemsPerPage = 9;

        let settings = {
            headerTitle: 'الشهادات',
            committeeName: 'لجنة التحول الرقمي والتدريب',
            logoUrl: '',
            footerText: '© 2026 نقابة تكنولوجيا المعلومات والبرمجيات - جميع الحقوق محفوظة',
            presidentName: 'المهندس / محمود جميل',
            presidentLabel: 'النقيب العام:',
            dashboardBtn: 'لوحة التحكم',
            logoutBtn: 'تسجيل الخروج',
            settingsBtn: 'الإعدادات',
            pageTitleMain: 'إدارة الشهادات',
            pageSubtitle: 'عرض وإدارة جميع الشهادات الموثقة في النظام',
            loaderText: 'جاري تحميل الشهادات...',
            presidentFooter: 'النقيب العام:',
            colors: {
                primary: '#C9A84C',
                accent: '#7C3AED',
                background: '#0A0E1A',
                text: '#FFFFFF',
                textSecondary: 'rgba(255,255,255,0.7)',
                textMuted: 'rgba(255,255,255,0.4)',
                textDim: 'rgba(255,255,255,0.15)',
                success: '#10B981',
                error: '#EF4444',
                warning: '#F59E0B',
                info: '#3B82F6',
                border: 'rgba(255,255,255,0.06)',
                cardBg: 'rgba(255,255,255,0.04)'
            }
        };

        let isReady = false;

        // ============================================================
        // 3. إعدادات الـ Listeners
        // ============================================================
        let generalUnsubscribe = null;
        let designUnsubscribe = null;
        let certificatesUnsubscribe = null;
        let academiesUnsubscribe = null;

        function startListeners() {
            let loadedCount = 0;
            const totalDocs = 4;

            function checkReady() {
                loadedCount++;
                if (loadedCount >= totalDocs && !isReady) {
                    isReady = true;
                    document.getElementById('pageContent').style.display = 'block';
                    document.getElementById('pageLoader').classList.remove('show');
                    console.log('تم تحميل كل البيانات بنجاح');
                }
            }

            document.getElementById('pageContent').style.display = 'none';
            document.getElementById('pageLoader').classList.add('show');

            if (generalUnsubscribe) generalUnsubscribe();
            generalUnsubscribe = db.collection('settings').doc('general').onSnapshot(function(doc) {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.headerTitle) settings.headerTitle = data.headerTitle;
                    if (data.committeeName) settings.committeeName = data.committeeName;
                    if (data.logoUrl) settings.logoUrl = data.logoUrl;
                    if (data.footerText) settings.footerText = data.footerText;
                    if (data.presidentName) settings.presidentName = data.presidentName;
                    if (data.presidentLabel) settings.presidentLabel = data.presidentLabel;
                    if (data.colors) settings.colors = { ...settings.colors, ...data.colors };
                }
                applySettings();
                applyColors(settings.colors);
                if (!isReady) checkReady();
                console.log('تحديث فوري: الإعدادات العامة');
            }, function(error) {
                console.warn('خطأ في الاستماع للإعدادات العامة:', error);
                if (!isReady) checkReady();
            });

            if (designUnsubscribe) designUnsubscribe();
            designUnsubscribe = db.collection('settings').doc('design').onSnapshot(function(doc) {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.colors) {
                        settings.colors = { ...settings.colors, ...data.colors };
                    }
                }
                applyColors(settings.colors);
                if (!isReady) checkReady();
                console.log('تحديث فوري: التصميم');
            }, function(error) {
                console.warn('خطأ في الاستماع للتصميم:', error);
                if (!isReady) checkReady();
            });

            if (certificatesUnsubscribe) certificatesUnsubscribe();
            certificatesUnsubscribe = db.collection('certificates').where('isActive', '==', true).onSnapshot(function(snapshot) {
                allCertificates = [];
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    data.id = doc.id;
                    allCertificates.push(data);
                });
                applyFilters();
                if (!isReady) checkReady();
                console.log('تحديث فوري: الشهادات (' + allCertificates.length + ')');
            }, function(error) {
                console.warn('خطأ في الاستماع للشهادات:', error);
                if (!isReady) checkReady();
            });

            if (academiesUnsubscribe) academiesUnsubscribe();
            academiesUnsubscribe = db.collection('academies').where('isDeleted', '==', false).onSnapshot(function(snapshot) {
                allAcademies = [];
                snapshot.forEach(function(doc) {
                    const data = doc.data();
                    data.id = doc.id;
                    allAcademies.push(data);
                });
                populateAcademiesSelect();
                if (!isReady) checkReady();
                console.log('تحديث فوري: الأكاديميات (' + allAcademies.length + ')');
            }, function(error) {
                console.warn('خطأ في الاستماع للأكاديميات:', error);
                if (!isReady) checkReady();
            });
        }

        // ============================================================
        // 4. تطبيق الإعدادات
        // ============================================================
        function applySettings() {
            const titleEl = document.getElementById('headerTitle');
            const committeeEl = document.getElementById('committeeName');
            const presidentLabelEl = document.getElementById('presidentLabel');
            const presidentNameEl = document.getElementById('headerPresidentName');
            const footerTextEl = document.getElementById('footerText');
            const presidentFooterEl = document.getElementById('presidentFooter');
            const presidentNameFooterEl = document.getElementById('presidentName');
            const dashboardBtn = document.getElementById('dashboardBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const roleBadge = document.getElementById('roleBadge');
            const pageTitleMain = document.getElementById('pageTitleMain');
            const pageSubtitle = document.getElementById('pageSubtitle');
            const loaderText = document.getElementById('loaderText');

            if (titleEl) titleEl.textContent = settings.headerTitle;
            if (committeeEl) committeeEl.textContent = settings.committeeName;
            if (presidentLabelEl) presidentLabelEl.textContent = settings.presidentLabel;
            if (presidentNameEl) presidentNameEl.textContent = settings.presidentName;
            if (footerTextEl) footerTextEl.textContent = settings.footerText;
            if (presidentFooterEl) presidentFooterEl.textContent = settings.presidentFooter;
            if (presidentNameFooterEl) presidentNameFooterEl.textContent = settings.presidentName;

            if (dashboardBtn) dashboardBtn.textContent = settings.dashboardBtn;
            if (logoutBtn) logoutBtn.textContent = settings.logoutBtn;
            if (settingsBtn) settingsBtn.textContent = settings.settingsBtn;
            if (pageTitleMain) pageTitleMain.textContent = settings.pageTitleMain;
            if (pageSubtitle) pageSubtitle.textContent = settings.pageSubtitle;
            if (loaderText) loaderText.textContent = settings.loaderText;

            if (roleBadge) {
                if (userRole === 'super_admin') {
                    roleBadge.textContent = 'سوبر أدمن';
                    roleBadge.style.background = 'rgba(139,92,246,0.15)';
                    roleBadge.style.color = '#8b5cf6';
                } else if (userRole === 'admin') {
                    roleBadge.textContent = 'أدمن';
                } else {
                    roleBadge.textContent = 'إدارة اللجنة';
                }
            }

            if (settings.logoUrl) {
                const logo = document.getElementById('logoBox');
                if (logo) {
                    logo.style.backgroundImage = 'url(' + settings.logoUrl + ')';
                    logo.style.backgroundSize = 'cover';
                    logo.style.backgroundPosition = 'center';
                    logo.textContent = '';
                }
            }

            const pageTitle = document.getElementById('pageTitle');
            if (pageTitle) {
                pageTitle.textContent = 'نقابة تكنولوجيا المعلومات والبرمجيات - الشهادات';
            }

            const ogTitle = document.getElementById('ogTitle');
            const ogDescription = document.getElementById('ogDescription');
            const ogImage = document.getElementById('ogImage');
            const ogUrl = document.getElementById('ogUrl');
            const ogSiteName = document.getElementById('ogSiteName');
            const twitterTitle = document.getElementById('twitterTitle');
            const twitterDescription = document.getElementById('twitterDescription');
            const twitterImage = document.getElementById('twitterImage');
            const favicon = document.getElementById('favicon');
            const appleIcon = document.getElementById('appleIcon');

            if (ogTitle) ogTitle.content = 'نقابة تكنولوجيا المعلومات والبرمجيات - الشهادات';
            if (ogDescription) ogDescription.content = 'إدارة الشهادات - نظام توثيق الشهادات';
            if (ogUrl) ogUrl.content = window.location.href;
            if (ogSiteName) ogSiteName.content = 'نقابة تكنولوجيا المعلومات والبرمجيات';
            if (twitterTitle) twitterTitle.content = 'نقابة تكنولوجيا المعلومات والبرمجيات - الشهادات';
            if (twitterDescription) twitterDescription.content = 'إدارة الشهادات - نظام توثيق الشهادات';

            if (settings.logoUrl) {
                if (ogImage) ogImage.content = settings.logoUrl;
                if (twitterImage) twitterImage.content = settings.logoUrl;
                if (favicon) favicon.href = settings.logoUrl;
                if (appleIcon) appleIcon.href = settings.logoUrl;
            }
        }

        function applyColors(colors) {
            const root = document.documentElement;
            if (colors.primary) root.style.setProperty('--primary-color', colors.primary);
            if (colors.accent) root.style.setProperty('--accent-color', colors.accent);
            if (colors.background) root.style.setProperty('--bg-color', colors.background);
            if (colors.text) root.style.setProperty('--text-color', colors.text);
            if (colors.textSecondary) root.style.setProperty('--text-secondary', colors.textSecondary);
            if (colors.textMuted) root.style.setProperty('--text-muted', colors.textMuted);
            if (colors.textDim) root.style.setProperty('--text-dim', colors.textDim);
            if (colors.success) root.style.setProperty('--success', colors.success);
            if (colors.error) root.style.setProperty('--error', colors.error);
            if (colors.warning) root.style.setProperty('--warning', colors.warning);
            if (colors.info) root.style.setProperty('--info', colors.info);
            if (colors.border) root.style.setProperty('--border', colors.border);
            if (colors.cardBg) root.style.setProperty('--card-bg', colors.cardBg);

            const primaryGlow = colors.primary ? colors.primary + '30' : 'rgba(201,168,76,0.3)';
            root.style.setProperty('--primary-glow', primaryGlow);
            const accentGlow = colors.accent ? colors.accent + '20' : 'rgba(124,58,237,0.2)';
            root.style.setProperty('--accent-glow', accentGlow);

            if (colors.background) {
                document.body.style.background = colors.background;
            }
        }

        // ============================================================
        // 5. دوال البحث والفلترة
        // ============================================================
        function populateAcademiesSelect() {
            const select = document.getElementById('academySelect');
            if (!select) return;
            const currentValue = select.value;
            select.innerHTML = '<option value="">اختر الأكاديمية</option>';
            allAcademies.forEach(function(a) {
                const opt = document.createElement('option');
                opt.value = a.id;
                opt.textContent = a.name || 'غير محدد';
                if (a.licenseNumber) {
                    opt.textContent += ' (' + a.licenseNumber + ')';
                }
                select.appendChild(opt);
            });
            if (currentValue) select.value = currentValue;
        }

        function loadAcademyBranches() {
            const academyId = document.getElementById('academySelect').value;
            const branchSelect = document.getElementById('branchSelect');
            const licenseInput = document.getElementById('academyLicense');
            const academyInfo = document.getElementById('academyInfo');
            const academyInfoText = document.getElementById('academyInfoText');

            branchSelect.innerHTML = '<option value="">اختر الفرع</option>';
            licenseInput.value = '';
            academyInfo.style.display = 'none';

            if (!academyId) return;

            const academy = allAcademies.find(function(a) { return a.id === academyId; });
            if (!academy) return;

            if (academy.licenseNumber) {
                licenseInput.value = academy.licenseNumber;
            }

            if (academy.branches && academy.branches.length > 0) {
                academy.branches.forEach(function(b) {
                    const opt = document.createElement('option');
                    opt.value = b.governorate || 'فرع';
                    opt.textContent = b.governorate || 'فرع';
                    if (b.address) opt.textContent += ' - ' + b.address;
                    branchSelect.appendChild(opt);
                });
            }

            // عرض معلومات الأكاديمية
            let infoText = 'الاسم: ' + (academy.name || 'غير محدد');
            if (academy.licenseNumber) infoText += ' | الرقم الاعتمادي: ' + academy.licenseNumber;
            if (academy.taxNumber) infoText += ' | البطاقة الضريبية: ' + academy.taxNumber;
            infoText += ' | عدد الفروع: ' + (academy.branches ? academy.branches.length : 0);
            academyInfoText.textContent = infoText;
            academyInfo.style.display = 'block';
        }

        function applyFilters(e) {
            if (e) e.preventDefault();

            const codeFilter = document.getElementById('searchCode').value.trim().toLowerCase();
            const studentFilter = document.getElementById('searchStudent').value.trim().toLowerCase();
            const nationalFilter = document.getElementById('searchNationalId').value.trim();
            const courseFilter = document.getElementById('searchCourse').value.trim().toLowerCase();
            const gradeFilter = document.getElementById('searchGrade').value;
            const statusFilter = document.getElementById('searchStatus').value;
            const academyFilter = document.getElementById('searchAcademy').value.trim().toLowerCase();
            const licenseFilter = document.getElementById('searchLicense').value.trim().toLowerCase();
            const sortBy = document.getElementById('sortBy').value;

            filteredCertificates = allCertificates.filter(function(item) {
                let match = true;
                if (codeFilter) {
                    match = match && (item.certificateCode || '').toLowerCase().includes(codeFilter);
                }
                if (studentFilter) {
                    match = match && (item.studentName || '').toLowerCase().includes(studentFilter);
                }
                if (nationalFilter) {
                    match = match && (item.studentNationalId || '').includes(nationalFilter);
                }
                if (courseFilter) {
                    match = match && (item.courseName || '').toLowerCase().includes(courseFilter);
                }
                if (gradeFilter) {
                    match = match && (item.grade || '').toUpperCase() === gradeFilter;
                }
                if (statusFilter === 'active') {
                    match = match && item.isActive !== false;
                } else if (statusFilter === 'inactive') {
                    match = match && item.isActive === false;
                }
                if (academyFilter) {
                    match = match && (item.academyName || '').toLowerCase().includes(academyFilter);
                }
                if (licenseFilter) {
                    match = match && (item.academyLicenseNumber || '').toLowerCase().includes(licenseFilter);
                }
                return match;
            });

            filteredCertificates.sort(function(a, b) {
                if (sortBy === 'code') {
                    return (a.certificateCode || '').localeCompare(b.certificateCode || '');
                } else if (sortBy === 'student') {
                    return (a.studentName || '').localeCompare(b.studentName || '');
                } else if (sortBy === 'course') {
                    return (a.courseName || '').localeCompare(b.courseName || '');
                } else if (sortBy === 'grade') {
                    return (a.grade || '').localeCompare(b.grade || '');
                } else if (sortBy === 'issuedAt') {
                    const dateA = a.issuedAt ? (a.issuedAt.toDate ? a.issuedAt.toDate() : new Date(a.issuedAt)) :
                        new Date(0);
                    const dateB = b.issuedAt ? (b.issuedAt.toDate ? b.issuedAt.toDate() : new Date(b.issuedAt)) :
                        new Date(0);
                    return dateB - dateA;
                }
                return 0;
            });

            currentPage = 1;
            renderCertificates();
            updateResultCount();
        }

        function resetFilters() {
            document.getElementById('searchCode').value = '';
            document.getElementById('searchStudent').value = '';
            document.getElementById('searchNationalId').value = '';
            document.getElementById('searchCourse').value = '';
            document.getElementById('searchGrade').value = '';
            document.getElementById('searchStatus').value = 'all';
            document.getElementById('searchAcademy').value = '';
            document.getElementById('searchLicense').value = '';
            document.getElementById('sortBy').value = 'issuedAt';
            applyFilters();
        }

        function updateResultCount() {
            const countEl = document.getElementById('resultCount');
            if (countEl) {
                countEl.textContent = 'عرض ' + filteredCertificates.length + ' شهادة';
            }
        }

        // ============================================================
        // 6. عرض الشهادات
        // ============================================================
        function renderCertificates() {
            const container = document.getElementById('certificatesGrid');
            if (!container) return;

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredCertificates.slice(start, end);
            const totalPages = Math.ceil(filteredCertificates.length / itemsPerPage);

            if (filteredCertificates.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📜</div>
                        <h3>لا توجد شهادات</h3>
                        <p>لم يتم العثور على شهادات تطابق معايير البحث</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = pageItems.map(function(item) {
                const isActive = item.isActive !== false;
                const statusClass = isActive ? 'active' : 'inactive';
                const statusText = isActive ? 'نشط' : 'غير نشط';
                const gradeClass = getGradeClass(item.grade);

                const issuedDate = item.issuedAt ? formatDate(item.issuedAt) : 'غير محدد';

                return `
                    <div class="certificate-card">
                        <div class="card-header">
                            <div>
                                <div class="code">${item.certificateCode || 'بدون كود'}</div>
                                <span class="status ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="info-item">
                                <div class="label">المتدرب</div>
                                <div class="value">${item.studentName || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">الرقم القومي</div>
                                <div class="value" style="font-size:12px;color:var(--text-muted);">${item.studentNationalId || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">الدورة</div>
                                <div class="value">${item.courseName || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">الساعات</div>
                                <div class="value">${item.courseHours || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">التقدير</div>
                                <div class="value ${gradeClass}">${item.grade || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">الأكاديمية</div>
                                <div class="value" style="font-size:12px;">${item.academyName || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">الفرع</div>
                                <div class="value" style="font-size:12px;">${item.branchName || item.branchId || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">الرقم الاعتمادي</div>
                                <div class="value" style="font-size:12px;color:var(--text-muted);">${item.academyLicenseNumber || '-'}</div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <span class="date">${issuedDate}</span>
                            <div class="actions">
                                <button class="btn btn-primary btn-sm" onclick="viewCertificate('${item.id}')">عرض</button>
                                ${userRole === 'super_admin' ? `
                                <button class="btn btn-outline btn-sm" onclick="editCertificate('${item.id}')">تعديل</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteCertificate('${item.id}')">حذف</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('pageInfo').textContent = 'صفحة ' + currentPage + ' من ' + Math.max(totalPages, 1);
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            const totalPages = Math.ceil(filteredCertificates.length / itemsPerPage);
            const newPage = currentPage + delta;
            if (newPage < 1 || newPage > totalPages) return;
            currentPage = newPage;
            renderCertificates();
        }

        function getGradeClass(grade) {
            if (!grade) return '';
            const g = grade.toUpperCase();
            if (g.startsWith('A')) return 'grade-a';
            if (g.startsWith('B')) return 'grade-b';
            if (g.startsWith('C')) return 'grade-c';
            if (g.startsWith('D')) return 'grade-d';
            return 'grade-f';
        }

        function formatDate(date) {
            if (!date) return '-';
            const d = date.toDate ? date.toDate() : new Date(date);
            return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // ============================================================
        // 7. إدارة الشهادات
        // ============================================================
        function generateCertificateCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = 'CERT-';
            for (var i = 0; i < 8; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function openAddModal() {
            if (userRole !== 'super_admin') {
                showMsg('غير مصرح لك بإضافة شهادات', 'error');
                return;
            }
            document.getElementById('addModal').classList.add('active');
            document.getElementById('addForm').reset();
            document.getElementById('branchSelect').innerHTML = '<option value="">اختر الفرع</option>';
            document.getElementById('academyLicense').value = '';
            document.getElementById('academyInfo').style.display = 'none';
            document.getElementById('studentNationalId').value = '';
            document.getElementById('courseHours').value = '';
            populateAcademiesSelect();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
        }

        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAddModal();
        });

        function addCertificate(e) {
            e.preventDefault();

            const studentName = document.getElementById('studentName').value.trim();
            const studentNationalId = document.getElementById('studentNationalId').value.trim();
            const courseName = document.getElementById('courseName').value.trim();
            const courseHours = parseInt(document.getElementById('courseHours').value);
            const grade = document.getElementById('grade').value;
            const academyId = document.getElementById('academySelect').value;
            const branchName = document.getElementById('branchSelect').value;
            const notes = document.getElementById('notes').value.trim();

            if (!studentName || !studentNationalId || !courseName || !courseHours || !grade || !academyId || !branchName) {
                showMsg('الرجاء ملء جميع الحقول المطلوبة', 'error');
                return false;
            }

            if (studentNationalId.length !== 14) {
                showMsg('الرقم القومي يجب أن يكون 14 رقم', 'error');
                return false;
            }

            const academy = allAcademies.find(function(a) { return a.id === academyId; });
            const certificateCode = generateCertificateCode();

            const data = {
                certificateCode: certificateCode,
                studentName: studentName,
                studentNationalId: studentNationalId,
                courseName: courseName,
                courseHours: courseHours,
                grade: grade,
                academyId: academyId,
                academyName: academy ? academy.name : '',
                academyLicenseNumber: academy ? academy.licenseNumber : '',
                branchName: branchName,
                notes: notes,
                isActive: true,
                issuedAt: firebase.firestore.FieldValue.serverTimestamp(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('certificates').add(data)
                .then(function() {
                    showMsg('تم إضافة الشهادة بنجاح', 'success');
                    closeAddModal();
                    // تسجيل النشاط
                    db.collection('activities').add({
                        type: 'create_certificate',
                        userName: currentUser ? currentUser.displayName || 'مستخدم' : 'مستخدم',
                        userId: currentUser ? currentUser.uid : '',
                        description: 'إضافة شهادة جديدة: ' + certificateCode,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    }).catch(function() {});
                })
                .catch(function(err) {
                    showMsg('حدث خطأ: ' + err.message, 'error');
                });

            return false;
        }

        function viewCertificate(id) {
            window.location.href = 'certificate-details.html?id=' + id;
        }

        function editCertificate(id) {
            window.location.href = 'certificate-edit.html?id=' + id;
        }

        function deleteCertificate(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الشهادة؟')) return;
            db.collection('certificates').doc(id).update({
                isActive: false,
                deletedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(function() {
                showMsg('تم حذف الشهادة بنجاح', 'success');
                db.collection('activities').add({
                    type: 'delete_certificate',
                    userName: currentUser ? currentUser.displayName || 'مستخدم' : 'مستخدم',
                    userId: currentUser ? currentUser.uid : '',
                    description: 'حذف شهادة',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(function() {});
            }).catch(function(err) {
                showMsg('حدث خطأ: ' + err.message, 'error');
            });
        }

        // ============================================================
        // 8. عرض الرسائل
        // ============================================================
        function showMsg(msg, type) {
            const el = document.getElementById('pageMsg');
            if (!el) return;
            el.textContent = msg;
            el.className = 'msg show ' + type;
            setTimeout(function() { el.className = 'msg'; }, 5000);
        }

        // ============================================================
        // 9. المصادقة
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (user) {
                currentUser = user;
                db.collection('users').doc(user.uid).get()
                    .then(function(doc) {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.role === 'super_admin' || data.role === 'admin' || data.role === 'committee_manager') {
                                userRole = data.role;
                                const settingsBtn = document.getElementById('settingsBtn');
                                if (data.role === 'super_admin') {
                                    if (settingsBtn) settingsBtn.style.display = 'inline-flex';
                                }
                                startListeners();
                            } else {
                                showMsg('غير مصرح بالوصول إلى هذه الصفحة', 'error');
                                setTimeout(function() { window.location.href = 'home.html'; }, 2000);
                            }
                        } else {
                            showMsg('المستخدم غير موجود', 'error');
                            setTimeout(function() { window.location.href = 'login.html'; }, 2000);
                        }
                    })
                    .catch(function(err) {
                        showMsg('حدث خطأ: ' + err.message, 'error');
                    });
            } else {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            auth.signOut().then(function() {
                window.location.href = 'login.html';
            });
        });

        // ============================================================
        // 10. بدء التشغيل
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('صفحة الشهادات - جاري التحميل');
            console.log('تحديث فوري للبيانات');
            console.log('فلاتر بحث متقدمة');
            console.log('إضافة شهادات مع اختيار الأكاديمية والفروع');
            console.log('🚫 تم منع قائمة النقر بزر الماوس الأيمن');
        });
    </script>
